name: Upstream fixture repairs paired verification
on:
  push:
    branches: [codex/verify-pr7322-failures-20261026]
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HUSKY: '0'
      FORCE_COLOR: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Compare baseline, independent fixes, and combined fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/comparison-results"
          result_dir="$GITHUB_WORKSPACE/comparison-results"
          printf 'Node: %s\n' "$(node --version)" | tee "$result_dir/environment.txt"
          uname -a >> "$result_dir/environment.txt"
          cat /etc/os-release >> "$result_dir/environment.txt"
          git fetch --no-tags https://github.com/Plastic-time/rea.git 626d0250dbfe07fc55fe17686b0bc437c510b32b
          while read -r label revision failures; do
            echo "::group::$label $revision"
            git fetch --no-tags https://github.com/Plastic-time/rea.git "$revision"
            checkout_dir="$RUNNER_TEMP/pr7322-$label"
            git worktree add --detach "$checkout_dir" "$revision"
            (
              cd "$checkout_dir"
              test "$(git rev-parse HEAD)" = "$revision"
              if [ "$label" = combined ]; then
                git diff 046c4ce353fabe9eccf3ec43a5f9fc29027db05e 626d0250dbfe07fc55fe17686b0bc437c510b32b -- tests/boundary/filesystem/safeOutputTreeCloseFailures.test.ts | git apply
              fi
              test "$(cat .nvmrc)" = '24.22.1'
              npm ci
              set +e
              npm run test:focused -- tests/composition/analysis-sessions/providerBinding.test.ts src/artifacts/apple/AppleAssetCatalogAnalysis.test.ts tests/boundary/filesystem/safeOutputTreeCloseFailures.test.ts 2>&1 | tee "$result_dir/$label.log"
              status=${PIPESTATUS[0]}
              set -e
              sed -E 's/\x1B\[[0-9;]*[mK]//g' "$result_dir/$label.log" > "$result_dir/$label.plain.log"
              printf '%s %s exit=%s\n' "$label" "$revision" "$status" | tee -a "$result_dir/status.txt"
              if [ "$failures" = 0 ]; then
                test "$status" -eq 0
                grep -Eq 'Tests[[:space:]]+51 passed' "$result_dir/$label.plain.log"
              else
                test "$status" -eq 1
                grep -Eq "Tests[[:space:]]+$failures failed" "$result_dir/$label.plain.log"
              fi
              if [ "$label" != baseline ]; then
                npm run check:fast
                npx --no-install oxfmt --check tests/composition/analysis-sessions/providerBinding.test.ts tests/boundary/filesystem/safeOutputTreeCloseFailures.test.ts
              fi
              git diff --check
              if [ "$label" != combined ]; then git diff --exit-code; fi
            )
            echo '::endgroup::'
          done <<'REVISIONS'
          baseline 046c4ce353fabe9eccf3ec43a5f9fc29027db05e 3
          provider 8658353b0d0bce41c9f2501e048622b98775b641 2
          extraction 626d0250dbfe07fc55fe17686b0bc437c510b32b 1
          combined 8658353b0d0bce41c9f2501e048622b98775b641 0
          REVISIONS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-fixture-repairs-comparison
          path: comparison-results/
          if-no-files-found: error

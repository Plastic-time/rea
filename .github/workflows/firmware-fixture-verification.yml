name: Firmware fixture Node compatibility verification
on:
  push:
    branches: [codex/verify-firmware-node-compat-20261024]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.4, 24.22.1, 26.12.1]
        revision:
          [
            238914974d17729bcdcc2e6cb012745d70d98a5e,
            15c9c975f04b7ebe55ea8caf4b8214fd017b21c5,
          ]
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.revision }}
          path: target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g npm@11.16.0
      - run: npm ci
        working-directory: target
      - name: Existing firmware boundary and MCP tests
        run: >-
          npm run test:focused --
          tests/boundary/firmware/firmwareIntegration.test.ts
          tests/boundary/firmware/firmwareWorkspaceRecovery.test.ts
          tests/boundary/firmware/firmwareReportFiles.test.ts
          tests/boundary/firmware/firmwarePublicationPaths.test.ts
          tests/boundary/firmware/firmwareValidationProjection.test.ts
          tests/boundary/mcp/firmwareMcp.test.ts
        working-directory: target
      - name: Repeated producer resource and digest measurements
        if: ${{ !cancelled() }}
        run: python3 ../harness/scripts/verify-firmware-fixture.py
        working-directory: target
        env:
          EXPECT_SUCCESS: ${{ matrix.revision == '15c9c975f04b7ebe55ea8caf4b8214fd017b21c5' && '1' || '0' }}
      - name: Required static checks
        if: ${{ !cancelled() && matrix.node == '24.22.1' && matrix.revision == '15c9c975f04b7ebe55ea8caf4b8214fd017b21c5' }}
        run: npm run check
        working-directory: target
